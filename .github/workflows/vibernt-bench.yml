# Vibernt runner benchmark (v045-b5). Manual dispatch only.
#
# Copies the steps of three upstream jobs at this commit, unchanged except:
#   - runs-on is the `runner` input (GitHub-hosted baseline or a Vibernt drop-in label);
#   - no secrets or repository variables (TURBO_TOKEN/TURBO_TEAM and the telemetry variable are dropped,
#     so turbo uses only its local cache in .turbo, restored by actions/cache as upstream does);
#   - cache=cold puts a per-run tag into the .turbo cache key and restore prefix so nothing restores;
#     cache=warm uses upstream's exact key and restore prefix;
#   - PR/merge-queue concurrency groups and the alls-green gate jobs are dropped.
#   - levers=all (0.4.5 lever round): the install runs through vibernt/ci/actions/deps@v1 (installed node_modules by
#     exact install identity, verified offline) instead of the shared setup action's install; pnpm and Node come from
#     the same pnpm/setup pin with install: false. deps runs as documented (0.4.7, Vibernt/ci v1 874cb23: the real
#     HOME; the 2026-10-09 HOME=/tmp/vibernt-deps-home workaround is gone).
#   - store (0.4.7 A/B of the dependency store, v045-b11): on = the runner's ~/.npmrc (the store) with deps' guard;
#     forced = the store with the guard off (store-guard: false); off = NPM_CONFIG_USERCONFIG names a copy of the
#     runner's npmrc without the store's lines (what the guard itself does when the store loses), so installs use
#     registry.npmjs.org. install=full gives deps an identity no tree is saved under (an npm_config_ nonce per run
#     attempt) and save: false, so every job installs in full and nothing is saved: the A/B measures installs. With
#     the store on, .github/vibernt/store-colo-probe.mjs fetches 40 lockfile tarballs through the store before and
#     after the install and tallies where the store answered from (x-vibernt-store: edge = the colo's cache, r2).
#     LEFTHOOK=0 keeps lefthook's postinstall out of .git/hooks. Turbo's remote cache is whatever the runner sets
#     (Vibernt drop-in: TURBO_API/TOKEN/TEAM in the runner's .env; the workflow sets none). id-token: write for the
#     Vibernt actions.
# Jobs: CI `test` (node 22.x) from ci.yml; E2E `adapter-integration` for drizzle-v2-relations and prisma from e2e.yml.
name: Vibernt bench

on:
  workflow_dispatch:
    inputs:
      runner:
        description: runs-on label
        type: choice
        options:
          - ubuntu-24.04
          - vibernt-ubuntu-24.04-4cpu
          - vibernt-ubuntu-24.04
        default: ubuntu-24.04
      cache:
        description: cold = cache keys that never match; warm = upstream cache keys
        type: choice
        options:
          - cold
          - warm
        default: warm
      levers:
        description: none = upstream setup; all = vibernt/ci deps around the install (remote build cache comes from the runner)
        type: choice
        options:
          - none
          - all
        default: none
      store:
        description: on = the dependency store with deps' guard; forced = the store without the guard; off = registry.npmjs.org (A/B of the store)
        type: choice
        options:
          - 'on'
          - 'off'
          - forced
        default: 'on'
      install:
        description: restore = deps as usual (restore or install and save); full = always a full install, nothing saved (store A/B)
        type: choice
        options:
          - restore
          - full
        default: restore

run-name: bench ${{ inputs.runner }} ${{ inputs.cache }} levers=${{ inputs.levers || 'none' }}${{ inputs.store != 'on' && format(' store={0}', inputs.store) || '' }}${{ inputs.install == 'full' && ' install=full' || '' }}

permissions: {}

env:
  BENCH_CACHE_TAG: ${{ inputs.cache == 'cold' && format('cold-{0}-{1}-', github.run_id, github.run_attempt) || '' }}

jobs:
  test:
    name: test (22.x)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    env:
      COMPOSE_SERVICES: postgres postgres-kysely mongodb
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache turbo build setup
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ env.BENCH_CACHE_TAG }}${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ env.BENCH_CACHE_TAG }}

      - if: inputs.levers != 'all'
        uses: better-auth/shared-workflows/.github/actions/setup-pnpm@08e5520e7a829b03bee1152913682b67d2ba44b1
        with:
          node-version: 22.x

      - name: Node version (levers)
        id: node
        if: inputs.levers == 'all'
        run: |
          v="22.x"
          if [[ -z "$v" ]]; then v=$(tr -d '[:space:]' < .nvmrc); fi
          echo "runtime=node@${v#v}" >> "$GITHUB_OUTPUT"
          if [[ "$STORE" == "off" && -f "$HOME/.npmrc" ]]; then
            f="$RUNNER_TEMP/bench-public-npmrc"
            grep -v -e '^registry=' -e '/npm/:_authToken=' -e '^# Vibernt dependency store' "$HOME/.npmrc" > "$f" || true
            echo "NPM_CONFIG_USERCONFIG=$f" >> "$GITHUB_ENV"
          fi
          if [[ "$INSTALL" == "full" ]]; then echo "npm_config_vibernt_bench_nonce=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"; fi
        env:
          STORE: ${{ inputs.store }}
          INSTALL: ${{ inputs.install }}

      - name: Setup pnpm and Node.js without install (levers)
        if: inputs.levers == 'all'
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: ${{ steps.node.outputs.runtime }}
          require-lockfile: true
          install: false

      - name: Registry in use (levers diagnostics)
        if: inputs.levers == 'all'
        run: |
          if [[ -f "$HOME/.npmrc" ]]; then echo "runner ~/.npmrc present (dependency store configured)"; else echo "no runner ~/.npmrc (no dependency store)"; fi
          echo "registry: $(pnpm config get registry)"

      - name: Dependency store colo probe before the install (A/B diagnostics)
        if: inputs.levers == 'all' && inputs.install == 'full' && inputs.store != 'off'
        run: node .github/vibernt/store-colo-probe.mjs before-install

      - name: Install dependencies (vibernt/deps, levers)
        id: deps
        if: inputs.levers == 'all'
        uses: vibernt/ci/actions/deps@v1
        env:
          LEFTHOOK: '0'
        with:
          save: ${{ inputs.install != 'full' }}
          store-guard: ${{ inputs.store != 'forced' }}
          outputs: |
            docs/.next
            docs/.source
            e2e/adapter/test/prisma-adapter/.tmp

      - name: deps outputs (levers diagnostics)
        if: inputs.levers == 'all'
        run: |
          echo "deps: mode=${{ steps.deps.outputs.mode }} cache-hit=${{ steps.deps.outputs.cache-hit }} registry=${{ steps.deps.outputs.registry }}"
          echo "deps key: ${{ steps.deps.outputs.key }}"
          echo "deps store-guard: ${{ steps.deps.outputs.store-guard }}"

      - name: Dependency store colo probe after the install (A/B diagnostics)
        if: inputs.levers == 'all' && inputs.install == 'full' && inputs.store != 'off'
        run: node .github/vibernt/store-colo-probe.mjs after-install

      - name: Rebuild native bindings for matrix node
        run: pnpm -r rebuild better-sqlite3

      - name: Reset Docker Containers
        run: docker compose down --volumes --remove-orphans

      - name: Start Docker Containers
        run: |
          read -r -a compose_services <<< "$COMPOSE_SERVICES"
          docker compose up -d --wait --wait-timeout 60 "${compose_services[@]}"

      - name: Test
        run: pnpm coverage

      - name: Docker Compose Diagnostics
        if: failure() && hashFiles('docker-compose.yml') != ''
        run: |
          read -r -a compose_services <<< "$COMPOSE_SERVICES"
          docker compose ps --all || true
          docker compose logs --no-color "${compose_services[@]}" || true

      - name: Stop Docker Containers
        if: always() && hashFiles('docker-compose.yml') != ''
        run: docker compose down --volumes --remove-orphans

  adapter-integration:
    name: ${{ matrix.packages }} Integration Test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - packages: "@better-auth-test/drizzle-v2-relations-adapter"
            compose_services: "postgres mysql"
          - packages: "@better-auth-test/prisma-adapter"
            compose_services: "postgres-prisma mysql-prisma"
    env:
      COMPOSE_SERVICES: ${{ matrix.compose_services }}
      FILTER: ${{ matrix.packages }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache turbo build setup
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ env.BENCH_CACHE_TAG }}${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ env.BENCH_CACHE_TAG }}

      - if: inputs.levers != 'all'
        uses: better-auth/shared-workflows/.github/actions/setup-pnpm@08e5520e7a829b03bee1152913682b67d2ba44b1

      - name: Node version (levers)
        id: node
        if: inputs.levers == 'all'
        run: |
          v=""
          if [[ -z "$v" ]]; then v=$(tr -d '[:space:]' < .nvmrc); fi
          echo "runtime=node@${v#v}" >> "$GITHUB_OUTPUT"
          if [[ "$STORE" == "off" && -f "$HOME/.npmrc" ]]; then
            f="$RUNNER_TEMP/bench-public-npmrc"
            grep -v -e '^registry=' -e '/npm/:_authToken=' -e '^# Vibernt dependency store' "$HOME/.npmrc" > "$f" || true
            echo "NPM_CONFIG_USERCONFIG=$f" >> "$GITHUB_ENV"
          fi
          if [[ "$INSTALL" == "full" ]]; then echo "npm_config_vibernt_bench_nonce=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"; fi
        env:
          STORE: ${{ inputs.store }}
          INSTALL: ${{ inputs.install }}

      - name: Setup pnpm and Node.js without install (levers)
        if: inputs.levers == 'all'
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: ${{ steps.node.outputs.runtime }}
          require-lockfile: true
          install: false

      - name: Registry in use (levers diagnostics)
        if: inputs.levers == 'all'
        run: |
          if [[ -f "$HOME/.npmrc" ]]; then echo "runner ~/.npmrc present (dependency store configured)"; else echo "no runner ~/.npmrc (no dependency store)"; fi
          echo "registry: $(pnpm config get registry)"

      - name: Dependency store colo probe before the install (A/B diagnostics)
        if: inputs.levers == 'all' && inputs.install == 'full' && inputs.store != 'off'
        run: node .github/vibernt/store-colo-probe.mjs before-install

      - name: Install dependencies (vibernt/deps, levers)
        id: deps
        if: inputs.levers == 'all'
        uses: vibernt/ci/actions/deps@v1
        env:
          LEFTHOOK: '0'
        with:
          save: ${{ inputs.install != 'full' }}
          store-guard: ${{ inputs.store != 'forced' }}
          outputs: |
            docs/.next
            docs/.source
            e2e/adapter/test/prisma-adapter/.tmp

      - name: deps outputs (levers diagnostics)
        if: inputs.levers == 'all'
        run: |
          echo "deps: mode=${{ steps.deps.outputs.mode }} cache-hit=${{ steps.deps.outputs.cache-hit }} registry=${{ steps.deps.outputs.registry }}"
          echo "deps key: ${{ steps.deps.outputs.key }}"
          echo "deps store-guard: ${{ steps.deps.outputs.store-guard }}"

      - name: Dependency store colo probe after the install (A/B diagnostics)
        if: inputs.levers == 'all' && inputs.install == 'full' && inputs.store != 'off'
        run: node .github/vibernt/store-colo-probe.mjs after-install

      - name: Reset Docker Containers
        run: docker compose down --volumes --remove-orphans

      - name: Build Adapter Dependencies
        run: pnpm exec turbo run build --filter="$FILTER..."

      - name: Start Docker Containers
        if: matrix.compose_services != ''
        run: |
          read -r -a compose_services <<< "$COMPOSE_SERVICES"
          for startup_attempt in 1 2; do
            if docker compose up -d --wait --wait-timeout 60 "${compose_services[@]}"; then
              exit 0
            fi

            if [[ "$startup_attempt" -eq 2 ]]; then
              exit 1
            fi

            echo "Container startup failed; resetting and retrying once."
            docker compose ps --all || true
            docker compose logs --no-color "${compose_services[@]}" || true
            if ! docker compose down --volumes --remove-orphans; then
              echo "::warning::Container cleanup failed; retrying startup with remaining resources."
            fi
          done

      - name: Adapter Integration
        run: pnpm e2e:integration --filter="$FILTER"

      - name: Docker Compose Diagnostics
        if: failure() && hashFiles('docker-compose.yml') != '' && matrix.compose_services != ''
        run: |
          read -r -a compose_services <<< "$COMPOSE_SERVICES"
          docker compose ps --all || true
          docker compose logs --no-color "${compose_services[@]}" || true
          for compose_service in "${compose_services[@]}"; do
            container_id="$(docker compose ps --all --quiet "$compose_service")"
            if [[ -n "$container_id" ]]; then
              docker inspect --format 'name={{.Name}} status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} error={{.State.Error}}' "$container_id" || true
            fi
          done

      - name: Stop Docker Containers
        if: always() && hashFiles('docker-compose.yml') != ''
        run: docker compose down --volumes --remove-orphans
