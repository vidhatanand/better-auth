# Vibernt fan-out benchmark. Manual dispatch only.
#
# CI `test` (node 22.x, ci.yml) and the E2E adapter integration tests of drizzle-v2-relations and prisma (e2e.yml), with
# Vibernt CI fan-out instead of one job each:
#   - `plan` lists each job's test files (.github/vibernt/*.files: the vitest files of every package `pnpm coverage` runs,
#     and of the two adapter test packages) and records the run's fan-out plan with the job's OIDC token; it outputs
#     each job's matrix (how many legs);
#   - each leg does upstream's setup unchanged (checkout, turbo cache, pnpm install, compose services, the turbo build
#     that upstream's `coverage`/`e2e:integration` tasks depend on), then pulls batches of test files from the run's
#     queue and runs them with each package's own vitest (.github/vibernt/run-vitest.sh), uploading each unit's JUnit.
# Differences from upstream: the coverage files are not merged (nyc), node 22.x only; no secrets, no upstream changes.
# `test` runs the packages upstream's `pnpm coverage` runs (turbo --filter=./packages/* --filter=./test/*, which does not
# include the `test` package itself).
# The fan-out action is a local copy of cri-ci actions/shard (.github/actions/vibernt-shard, see its header).
name: Vibernt fan-out

on:
  workflow_dispatch:
    inputs:
      runner:
        description: runs-on label of the legs
        type: choice
        options:
          - vibernt-ubuntu-24.04-4cpu
          - vibernt-ubuntu-24.04
          - ubuntu-24.04
        default: vibernt-ubuntu-24.04-4cpu
      plan-runner:
        description: runs-on label of the plan job
        type: choice
        options:
          - vibernt-ubuntu-24.04
          - vibernt-ubuntu-24.04-4cpu
          - ubuntu-24.04
        default: vibernt-ubuntu-24.04

run-name: fanout ${{ inputs.runner }}

permissions: {}

jobs:
  plan:
    name: Fan-out plan
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.plan-runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      test: ${{ steps.test.outputs.matrix }}
      drizzle-v2: ${{ steps.drizzle.outputs.matrix }}
      prisma: ${{ steps.prisma.outputs.matrix }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - id: test
        name: Plan CI test
        uses: ./.github/actions/vibernt-shard
        with:
          mode: plan
          job: test
          files-from: .github/vibernt/test.files
          max: 8
          target: 3m
          fail-on-error: true
      - id: drizzle
        name: Plan drizzle-v2-relations adapter tests
        uses: ./.github/actions/vibernt-shard
        with:
          mode: plan
          job: drizzle-v2
          files-from: .github/vibernt/drizzle-v2.files
          max: 6
          target: 3m
          fail-on-error: true
      - id: prisma
        name: Plan prisma adapter tests
        uses: ./.github/actions/vibernt-shard
        with:
          mode: plan
          job: prisma
          files-from: .github/vibernt/prisma.files
          max: 3
          target: 3m
          fail-on-error: true

  test:
    name: test (22.x) fan-out (leg ${{ matrix.shard }})
    if: github.event_name == 'workflow_dispatch'
    needs: plan
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.test) }}
    env:
      COMPOSE_SERVICES: postgres postgres-kysely mongodb
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache turbo build setup
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - uses: better-auth/shared-workflows/.github/actions/setup-pnpm@08e5520e7a829b03bee1152913682b67d2ba44b1
        with:
          node-version: 22.x

      - name: Rebuild native bindings for matrix node
        run: pnpm -r rebuild better-sqlite3

      - name: Reset Docker Containers
        run: docker compose down --volumes --remove-orphans

      - name: Start Docker Containers
        run: |
          read -r -a compose_services <<< "$COMPOSE_SERVICES"
          docker compose up -d --wait --wait-timeout 60 "${compose_services[@]}"

      - name: Build packages (what turbo coverage depends on)
        run: pnpm build

      - name: Test (fan-out leg ${{ matrix.shard }})
        uses: ./.github/actions/vibernt-shard
        env:
          VITEST_ARGS: --coverage --coverage.provider=istanbul
        with:
          mode: pull
          job: test
          index: ${{ matrix.shard }}
          batch: 48
          unit-timeout-floor-ms: 1500000
          run: bash .github/vibernt/run-vitest.sh {files}
          junit: .vibernt-junit/*.xml

      - name: Docker Compose Diagnostics
        if: failure()
        run: |
          read -r -a compose_services <<< "$COMPOSE_SERVICES"
          docker compose ps --all || true
          docker compose logs --no-color "${compose_services[@]}" || true

      - name: Stop Docker Containers
        if: always()
        run: docker compose down --volumes --remove-orphans

  drizzle-v2:
    name: "@better-auth-test/drizzle-v2-relations-adapter Integration Test fan-out (leg ${{ matrix.shard }})"
    if: github.event_name == 'workflow_dispatch'
    needs: plan
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.drizzle-v2) }}
    env:
      COMPOSE_SERVICES: postgres mysql
      FILTER: "@better-auth-test/drizzle-v2-relations-adapter"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache turbo build setup
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - uses: better-auth/shared-workflows/.github/actions/setup-pnpm@08e5520e7a829b03bee1152913682b67d2ba44b1

      - name: Reset Docker Containers
        run: docker compose down --volumes --remove-orphans

      - name: Build Adapter Dependencies
        run: pnpm exec turbo run build --filter="$FILTER..."

      - name: Start Docker Containers
        run: |
          read -r -a compose_services <<< "$COMPOSE_SERVICES"
          for startup_attempt in 1 2; do
            if docker compose up -d --wait --wait-timeout 60 "${compose_services[@]}"; then
              exit 0
            fi

            if [[ "$startup_attempt" -eq 2 ]]; then
              exit 1
            fi

            echo "Container startup failed; resetting and retrying once."
            docker compose ps --all || true
            docker compose logs --no-color "${compose_services[@]}" || true
            if ! docker compose down --volumes --remove-orphans; then
              echo "::warning::Container cleanup failed; retrying startup with remaining resources."
            fi
          done

      - name: Adapter Integration (fan-out leg ${{ matrix.shard }})
        uses: ./.github/actions/vibernt-shard
        with:
          mode: pull
          job: drizzle-v2
          index: ${{ matrix.shard }}
          batch: 48
          unit-timeout-floor-ms: 1500000
          run: bash .github/vibernt/run-vitest.sh {files}
          junit: .vibernt-junit/*.xml

      - name: Docker Compose Diagnostics
        if: failure()
        run: |
          read -r -a compose_services <<< "$COMPOSE_SERVICES"
          docker compose ps --all || true
          docker compose logs --no-color "${compose_services[@]}" || true

      - name: Stop Docker Containers
        if: always()
        run: docker compose down --volumes --remove-orphans

  prisma:
    name: "@better-auth-test/prisma-adapter Integration Test fan-out (leg ${{ matrix.shard }})"
    if: github.event_name == 'workflow_dispatch'
    needs: plan
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.prisma) }}
    env:
      COMPOSE_SERVICES: postgres-prisma mysql-prisma
      FILTER: "@better-auth-test/prisma-adapter"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache turbo build setup
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - uses: better-auth/shared-workflows/.github/actions/setup-pnpm@08e5520e7a829b03bee1152913682b67d2ba44b1

      - name: Reset Docker Containers
        run: docker compose down --volumes --remove-orphans

      - name: Build Adapter Dependencies
        run: pnpm exec turbo run build --filter="$FILTER..."

      - name: Start Docker Containers
        run: |
          read -r -a compose_services <<< "$COMPOSE_SERVICES"
          for startup_attempt in 1 2; do
            if docker compose up -d --wait --wait-timeout 60 "${compose_services[@]}"; then
              exit 0
            fi

            if [[ "$startup_attempt" -eq 2 ]]; then
              exit 1
            fi

            echo "Container startup failed; resetting and retrying once."
            docker compose ps --all || true
            docker compose logs --no-color "${compose_services[@]}" || true
            if ! docker compose down --volumes --remove-orphans; then
              echo "::warning::Container cleanup failed; retrying startup with remaining resources."
            fi
          done

      - name: Adapter Integration (fan-out leg ${{ matrix.shard }})
        uses: ./.github/actions/vibernt-shard
        with:
          mode: pull
          job: prisma
          index: ${{ matrix.shard }}
          batch: 48
          unit-timeout-floor-ms: 1500000
          run: bash .github/vibernt/run-vitest.sh {files}
          junit: .vibernt-junit/*.xml

      - name: Docker Compose Diagnostics
        if: failure()
        run: |
          read -r -a compose_services <<< "$COMPOSE_SERVICES"
          docker compose ps --all || true
          docker compose logs --no-color "${compose_services[@]}" || true

      - name: Stop Docker Containers
        if: always()
        run: docker compose down --volumes --remove-orphans
